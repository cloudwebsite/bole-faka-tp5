<script src="//www.layuicdn.com/layui-v2.4.5/layui.js?v=201811010202"></script>


<script type="text/javascript">

 			  function Init(){
 			  $('.item-order').click(function() {

              					 for(var i=0; i<data.length; i++)  
                                {
                                   htmlString += data[i].title +"：";  
                                   htmlString += data[i].text;  
                                }
                       
                       
                                       if(val.replace(/\s+/g,"")!=="") {
                                                        
										layer.closeAll('page');
                                        window.index = layer.open({
                                            type: 1,
                                            title: number+"订单详情",
                                            closeBtn: 0, //不显示关闭按钮
                                            skin: 'layui-layer-lan',
                                            shade: false,
                                            area: ['20%', 'auto'],
                                            offset: 'rb', //右下角弹出
                                            anim: 2,
                                            content: '<div style="padding: 15px 30px;margin: 15px;padding: 0px;overflow: hidden; ">'+ htmlString + val + '</div>' //iframe的url，no代表不显示滚动条

                                        });
                                    }
					
						});
                
					
				});
    
    
}
    //laypage分页
    Ajaxpage();
    function Ajaxpage(curr){
        var key=$('#key').val();
        var selected=$('#type option:selected').val();
        var mstatus=$('#mstatus option:selected').val();
        $.getJSON('{:url("Order/index")}', {page: curr || 1,key:key,type:selected,mstatus:mstatus}, function(data){
            $(".spiner-example").css('display','none'); //数据加载完关闭动画 
            if(data==''){
                $("#list-content").html('<td colspan="20" style="padding-top:10px;padding-bottom:10px;font-size:16px;text-align:center">暂无数据</td>');
            }else{
                var tpl = document.getElementById('list-template').innerHTML;
                laytpl(tpl).render(data, function(html){
                    document.getElementById('list-content').innerHTML = html;
                });
                laypage({
                    cont: $('#AjaxPage'),//容器。值支持id名、原生dom对象，jquery对象,
                    pages:'{$allpage}',//总页数
                    skip: true,//是否开启跳页
                    
                    skin: '#1AB5B7',//分页组件颜色
                    curr: curr || 1,
                    groups: 3,//连续显示分页数
                    jump: function(obj, first){
                        if(!first){
                            Ajaxpage(obj.curr)
                        }
                      
    					Init();
                        $('#allpage').html('第'+ obj.curr +'页，共'+ obj.pages +'页');
                    }
                });
            }
        });
    }

function checkAll() {  
        var all=document.getElementById('all');//获取到点击全选的那个复选框的id  
        var one=document.getElementsByName('checkname[]');//获取到复选框的名称  
        if(all.checked==true){
            for(var i=0;i<one.length;i++){  
                one[i].checked=true;
                
            }  
  
        }else{  
            for(var j=0;j<one.length;j++){  
                one[j].checked=false;  
            }  
        }  
}

function removeHTMLTag(str) {
            str = str.replace(/<(style|script|iframe)[^>]*?>[\s\S]+?<\/\1\s*>/gi,'').replace(/<[^>]+?>/g,'').replace(/\s+/g,' ').replace(/ /g,' ').replace(/>/g,' '); //去除HTML tag
            str = str.replace(/[ | ]*\n/g,'\n'); //去除行尾空白
            //str = str.replace(/\n[\s| | ]*\r/g,'\n'); //去除多余空行
            str=str.replace(/&nbsp;/ig,'');//去掉&nbsp;
            //str=str.replace(/\s/g,''); //将空格去掉
            return str;
}
function htmlspecialchars(str) {        
              var s = "";  
              if (str.length == 0) return "";  
              for   (var i=0; i<str.length; i++)  
              {  
                  switch (str.substr(i,1))  
                  {  
                      case "<": s += "&lt;"; break;  
                      case ">": s += "&gt;"; break;  
                      case "&": s += "&amp;"; break;  
                      case " ":  
                          if(str.substr(i + 1, 1) == " "){  
                              s += " &nbsp;";  
                              i++;  
                          } else s += " ";  
                          break;  
                      case "\"": s += "&quot;"; break;  
                      case "\n": s += "<br>"; break;  
                      default: s += str.substr(i,1); break;  
                  }  
              }  
              return s;  
          }
  function htmlspecialchars_decode(str){           
              str = str.replace(/&amp;/g, '&'); 
              str = str.replace(/&lt;/g, '<');
              str = str.replace(/&gt;/g, '>');
              str = str.replace(/&quot;/g, "''");  
              str = str.replace(/&#039;/g, "'");  
              return str;  
    }


</script>
