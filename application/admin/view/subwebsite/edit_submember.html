{include file="public/header" /}
<link rel="stylesheet" type="text/css" href="/static/admin/webupload/webuploader.css">
<link rel="stylesheet" type="text/css" href="/static/admin/webupload/style.css">
<style>
.file-item{float: left; position: relative; width: 110px;height: 110px; margin: 0 20px 20px 0; padding: 4px;}
.file-item .info{overflow: hidden;}
.uploader-list{width: 100%; overflow: hidden;}
</style>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>编辑子站</h5>
                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                    </div>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal" name="edit_member" id="edit_member" method="post" action="{:url('edit_submember')}">
                        {:token()}
                        <input type="hidden" name="id" value="{$member.id}">
                        <div class="form-group">
                            <label class="col-sm-3 control-label">子站账号：</label>
                            <div class="input-group col-sm-4">
                                <input id="account" type="text" class="form-control" name="account" value="{$member.account}" placeholder="请输入账号" disabled="">
                            </div>
                        </div>
                       
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">子站状态：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='fzstatus' value="1" {if condition="$member['fzstatus'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='fzstatus' value="0" {if condition="$member['fzstatus'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
  
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">子站域名：</label>
                            <div class="input-group col-sm-4">
                                <input id="fzhost" type="text" class="form-control" name="fzhost" value="{$member.fzhost}" placeholder="请输入子站域名">
                            </div>
                        </div>
                        
                   
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">商品标题修改权限：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='goodsname' value="1" {if condition="$fzauth['goodsname'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='goodsname' value="0" {if condition="$fzauth['goodsname'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">商品图片修改权限：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='goodsimgurl' value="1" {if condition="$fzauth['goodsimgurl'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='goodsimgurl' value="0" {if condition="$fzauth['goodsimgurl'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">商品内容修改权限：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='goodsxqnotice' value="1" {if condition="$fzauth['goodsxqnotice'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='goodsxqnotice' value="0" {if condition="$fzauth['goodsxqnotice'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">商品价格修改权限：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='goodsprice' value="1" {if condition="$fzauth['goodsprice'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='goodsprice' value="0" {if condition="$fzauth['goodsprice'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label">查看用户订单权限：</label>
                            <div class="col-sm-6">
                                <div class="radio i-checks">
                                    <input type="radio" name='ordersauth' value="1" {if condition="$fzauth['ordersauth'] eq 1 "}checked{/if}/>开启&nbsp;&nbsp;
                                    <input type="radio" name='ordersauth' value="0" {if condition="$fzauth['ordersauth'] eq 0 "}checked{/if}/>关闭
                                </div>
                            </div>
                        </div>
                       
                        
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-3">
                                <button class="btn btn-primary" type="submit"><i class="fa fa-save"></i> 保存</button>&nbsp;&nbsp;&nbsp;
                                <a class="btn btn-danger" href="javascript:history.go(-1);"><i class="fa fa-close"></i> 返回</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{include file="public/footer" /}
<script type="text/javascript" src="/static/admin/webupload/webuploader.min.js"></script>

<script type="text/javascript">
    var $list = $('#fileList');
    //上传图片,初始化WebUploader
    var uploader = WebUploader.create({
     
        auto: true,// 选完文件后，是否自动上传。   
        swf: '/static/admin/webupload/Uploader.swf',// swf文件路径 
        server: "{:url('Upload/uploadface')}",// 文件接收服务端。
        duplicate :true,// 重复上传图片，true为可重复false为不可重复
        pick: '#imgPicker',// 选择文件的按钮。可选。

        accept: {
            title: 'Images',
            extensions: 'gif,jpg,jpeg,bmp,png',
            mimeTypes: 'image/jpg,image/jpeg,image/png'
        },

        'onUploadSuccess': function(file, data, response) {
            $("#data_photo").val(data._raw);
            $("#img_data").attr('src', '/uploads/face/' + data._raw).show();
        }
    });

    uploader.on( 'fileQueued', function( file ) {
        $list.html( '<div id="' + file.id + '" class="item">' +
            '<h4 class="info">' + file.name + '</h4>' +
            '<p class="state">正在上传...</p>' +
        '</div>' );
    });

    // 文件上传成功
    uploader.on( 'uploadSuccess', function( file ) {
        $( '#'+file.id ).find('p.state').text('上传成功！');
    });

    // 文件上传失败，显示上传出错。
    uploader.on( 'uploadError', function( file ) {
        $( '#'+file.id ).find('p.state').text('上传出错!');
    }); 

    //提交
    $(function(){
        $('#edit_member').ajaxForm({
            beforeSubmit: checkForm, 
            success: complete, 
            dataType: 'json'
        });
        
        function checkForm(){
                                                  

           if( '' == $.trim($('#account').val())){
                layer.msg('请输入账号',{icon:2,time:1500,shade: 0.1}, function(index){
                layer.close(index);
                });
                return false;
            }

            
                       
            if( '' == $.trim($('#fzhost').val())){
                layer.msg('请输入子站域名',{icon:2,time:1500,shade: 0.1}, function(index){
                layer.close(index);
                });
                return false;
            }

        }

        function complete(data){
            if(data.code==1){
                layer.msg(data.msg, {icon: 6,time:1500,shade: 0.1}, function(index){
                    window.location.href="{:url('subwebsite/sublist')}";
                });
            }else{
                layer.msg(data.msg, {icon: 5,time:1500,shade: 0.1});
                return false;   
            }
        }   
    });

</script>
</body>
</html>
