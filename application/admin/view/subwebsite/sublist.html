                        <script type="application/javascript">
                        	 var AddDays=function (dayStart,dayEnd) {
								var date=new Date();
								var myDate=new Date(dayStart*1000+dayEnd*24*60*60*1000);
								
								var year=myDate.getFullYear();
								var month=myDate.getMonth()+1;
								var day=myDate.getDate();
								CurrentDate=year+"-";
								if(month>=10)
								{
									CurrentDate=CurrentDate+month+"-";
								}
								else
								{
									CurrentDate=CurrentDate+"0"+month+"-";
								}
								if(day>=10)
								{
									CurrentDate=CurrentDate+day;
								}
								else
								{
									CurrentDate=CurrentDate+"0"+day;
								}
								return CurrentDate;
							   };
                        </script>

<script type="text/javascript">
   
    //laypage分页
    Ajaxpage();
    function Ajaxpage(curr){
        var key=$('#key').val();
        var group_id=$('#group_id').val();
        $.getJSON('{:url("Subwebsite/sublist")}', {page: curr || 1,key:key,group_id:group_id}, function(data){
            $(".spiner-example").css('display','none'); //数据加载完关闭动画 
            if(data==''){
                $("#list-content").html('<td colspan="20" style="padding-top:10px;padding-bottom:10px;font-size:16px;text-align:center">暂无数据</td>');
            }else{
                var tpl = document.getElementById('list-template').innerHTML;
                laytpl(tpl).render(data, function(html){
                    document.getElementById('list-content').innerHTML = html;
                });
                laypage({
                    cont: $('#AjaxPage'),//容器。值支持id名、原生dom对象，jquery对象,
                    pages:'{$allpage}',//总页数
                    skip: true,//是否开启跳页
                    skin: '#1AB5B7',//分页组件颜色
                    curr: curr || 1,
                    groups: 3,//连续显示分页数
                    jump: function(obj, first){
                        if(!first){
                            Ajaxpage(obj.curr)
                        }
                        $('#allpage').html('第'+ obj.curr +'页，共'+ obj.pages +'页');
                    }
                });
            }
        });
    }

function toDecimal(x){
  		var f = parseFloat(x);
		if(isNaN(f)) {
			return false;
		}
		var f;
		if(getFloor(x)<2){
			f = Math.round(x * 100) / 100;
		}else if(getFloor(x)>2){
			f = Math.round(x * 10000) / 10000;
		}	
		var s = f.toString();
		var rs = s.indexOf('.');
		if(rs < 0) {
			rs = s.length;
			s += '.';
		}
		while(s.length <= rs + 2) {
			s += '0';
		}
		return s;
  	}
  	
	function getFloor(x){
		var y = String(x).indexOf('.') + 1;
		var count = String(x).length - y;
		if(y <= 0) {
			count=0;
		}
		return count;										
	} 
 
</script>
