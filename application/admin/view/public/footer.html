<script>
    (function () {
        // 不依赖 jQuery：先同步 meta，再给所有 POST 表单补令牌
        var meta = document.querySelector('meta[name="csrf-token"]');
        var inputs = document.querySelectorAll('input[name="__token__"]');
        var csrf = '';
        if (inputs.length) {
            csrf = inputs[inputs.length - 1].value || '';
            if (meta && csrf) {
                meta.setAttribute('content', csrf);
            }
        } else if (meta) {
            csrf = meta.getAttribute('content') || '';
        }
        if (csrf) {
            var forms = document.getElementsByTagName('form');
            for (var i = 0; i < forms.length; i++) {
                var method = (forms[i].getAttribute('method') || 'get').toLowerCase();
                if (method !== 'post') {
                    continue;
                }
                if (forms[i].querySelector('input[name="__token__"]')) {
                    continue;
                }
                var hid = document.createElement('input');
                hid.type = 'hidden';
                hid.name = '__token__';
                hid.value = csrf;
                forms[i].appendChild(hid);
            }
        }
        if (window.jQuery && csrf) {
            $.ajaxSetup({
                headers: {'X-CSRF-TOKEN': csrf},
                beforeSend: function (xhr, settings) {
                    var method = (settings.type || 'GET').toUpperCase();
                    if (method !== 'GET' && method !== 'HEAD') {
                        if (typeof settings.data === 'string') {
                            if (settings.data.indexOf('__token__=') === -1) {
                                settings.data += (settings.data ? '&' : '') + '__token__=' + encodeURIComponent(csrf);
                            }
                        } else if (settings.data && typeof settings.data === 'object' && !settings.data.__token__) {
                            settings.data.__token__ = csrf;
                        }
                    }
                }
            });
        }
    })();
    if (window.jQuery) {
        $(document).ready(function () {
            $(".i-checks").iCheck({checkboxClass: "icheckbox_square-green", radioClass: "iradio_square-green"});
        });
    }
</script>
