{include file="public/header"/}
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>充值卡密</h5>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-12">
                    <div class="col-sm-2" style="width: 120px">
                        <a href="{:url('add')}"><button class="btn btn-outline btn-primary" type="button">生成/导入</button></a>
                    </div>
                    <div class="col-sm-2" style="width: 120px">
                        <a href="{:url('export',['batch_no'=>$batch_no])}"><button class="btn btn-outline btn-success" type="button">导出未用</button></a>
                    </div>
                    <form name="admin_list_sea" class="form-search" method="get" action="{:url('index')}">
                        <div class="col-sm-3">
                            <div class="input-group">
                                <input type="text" id="key" class="form-control" name="key" value="{$val}" placeholder="卡密关键字"/>
                                <span class="input-group-btn">
                                    <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> 搜索</button>
                                </span>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <select name="status" class="form-control" onchange="this.form.submit()">
                                <option value="" {if condition="$status === ''"}selected{/if}>全部状态</option>
                                <option value="0" {if condition="$status === '0' || $status === 0"}selected{/if}>未使用</option>
                                <option value="1" {if condition="$status === '1' || $status === 1"}selected{/if}>已使用</option>
                            </select>
                        </div>
                        <div class="col-sm-2">
                            <input type="text" class="form-control" name="batch_no" value="{$batch_no}" placeholder="批次号"/>
                        </div>
                    </form>
                </div>
            </div>
            <div class="hr-line-dashed"></div>
            <div class="example-wrap">
                <div class="example">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr class="long-tr">
                                <th width="5%">ID</th>
                                <th width="18%">卡密</th>
                                <th width="8%">面额</th>
                                <th width="8%">状态</th>
                                <th width="12%">批次</th>
                                <th width="8%">会员ID</th>
                                <th width="12%">兑换时间</th>
                                <th width="12%">创建时间</th>
                                <th width="10%">操作</th>
                            </tr>
                        </thead>
                        <script id="list-template" type="text/html">
                            {{# for(var i=0;i<d.length;i++){  }}
                                <tr class="long-td">
                                    <td>{{d[i].id}}</td>
                                    <td>{{d[i].code}}</td>
                                    <td>{{d[i].money}}</td>
                                    {{# if(d[i].status==0){ }}
                                     <td><span class="label label-primary">未使用</span></td>
                                    {{# }else{ }}
                                     <td><span class="label label-default">已使用</span></td>
                                    {{# } }}
                                    <td>{{d[i].batch_no}}</td>
                                    <td>{{d[i].memberid || '-'}}</td>
                                    <td>{{d[i].use_time}}</td>
                                    <td>{{d[i].create_time}}</td>
                                    <td>
                                        {{# if(d[i].status==0){ }}
                                        <a href="javascript:;" onclick="del_kami({{d[i].id}})" class="btn btn-danger btn-outline btn-xs">
                                            <i class="fa fa-trash-o"></i> 删除
                                        </a>
                                        {{# }else{ }}
                                        -
                                        {{# } }}
                                    </td>
                                </tr>
                            {{# } }}
                        </script>
                        <tbody id="list-content"></tbody>
                    </table>
                    <div id="AjaxPage" style="text-align:right;"></div>
                    <div style="text-align: right;">
                        共{$count}条数据，<span id="allpage"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="spiner-example">
    <div class="sk-spinner sk-spinner-three-bounce">
        <div class="sk-bounce1"></div>
        <div class="sk-bounce2"></div>
        <div class="sk-bounce3"></div>
    </div>
</div>
{include file="public/footer" /}
<script type="text/javascript">
    Ajaxpage();
    function Ajaxpage(curr){
        var key=$('#key').val();
        $.getJSON('{:url("recharge_kami/index")}', {
            page: curr || 1,
            key: key,
            status: '{$status}',
            batch_no: '{$batch_no}'
        }, function(data){
            $(".spiner-example").css('display','none');
            if(data=='' || data.length==0){
                $("#list-content").html('<td colspan="20" style="padding-top:10px;padding-bottom:10px;font-size:16px;text-align:center">暂无数据</td>');
            }else{
                var tpl = document.getElementById('list-template').innerHTML;
                laytpl(tpl).render(data, function(html){
                    document.getElementById('list-content').innerHTML = html;
                });
                laypage({
                    cont: $('#AjaxPage'),
                    pages:'{$allpage}',
                    skip: true,
                    skin: '#1AB5B7',
                    curr: curr || 1,
                    groups: 3,
                    jump: function(obj, first){
                        if(!first){
                            Ajaxpage(obj.curr)
                        }
                        $('#allpage').html('第'+ obj.curr +'页，共'+ obj.pages +'页');
                    }
                });
            }
        });
    }

    function del_kami(id){
        layer.confirm('确认删除此未使用卡密吗?', {icon: 3, title:'提示'}, function(index){
            $.getJSON('{:url("recharge_kami/del")}', {id: id}, function(res){
                layer.msg(res.msg,{icon:res.code==1?1:2,time:1500},function(){
                    if(res.code==1){ Ajaxpage(1); }
                });
            });
            layer.close(index);
        });
    }
</script>
</body>
</html>
