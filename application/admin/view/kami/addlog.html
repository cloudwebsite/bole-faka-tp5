{include file="public/header" /}
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="ibox float-e-margins">
        <div class="ibox-title">
            <h5>
                {if condition="$goodid"}
                入库日志 — {$goodsname}（商品ID {$goodid}）
                {else /}
                入库日志（全站）
                {/if}
            </h5>
            <div class="ibox-tools">
                <a href="{$back_goods_url}" class="btn btn-white btn-xs">返回商品卡密</a>
                {if condition="$goodid"}
                <a href="{:url('Kami/index',['id'=>$goodid])}" class="btn btn-white btn-xs">返回该商品卡密</a>
                <a href="{:url('Kami/addlog')}" class="btn btn-primary btn-xs">查看全站日志</a>
                {/if}
            </div>
        </div>
        <div class="ibox-content">
            <div class="row">
                <div class="col-sm-12">
                    <form name="admin_list_sea" class="form-search" method="get" action="{:url('addlog')}">
                        {if condition="$goodid"}
                        <input type="hidden" name="goodid" id="goodid" value="{$goodid}" />
                        {else /}
                        <div class="col-sm-2">
                            <input type="text" id="goodid" class="form-control" name="goodid" value="{$goodid}" placeholder="商品ID" />
                        </div>
                        {/if}
                        <div class="col-sm-2">
                            <input type="text" id="addqudao" class="form-control" name="addqudao" value="{$addqudao}" placeholder="操作人/用户名" />
                        </div>
                        <div class="col-sm-2">
                            <input type="text" id="userip" class="form-control" name="userip" value="{$userip}" placeholder="操作 IP" />
                        </div>
                        <div class="col-sm-3">
                            <div class="input-group">
                                <input type="text" id="key" class="form-control" name="key" value="{$val}" placeholder="补货标识" />
                                <span class="input-group-btn">
                                    <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> 搜索</button>
                                </span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="hr-line-dashed"></div>
            <div class="example-wrap">
                <div class="example">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr class="long-tr">
                                <th width="5%">ID</th>
                                <th>商品</th>
                                <th width="6%">商品ID</th>
                                <th width="14%">补货标识</th>
                                <th width="6%">总数</th>
                                <th width="6%">成功</th>
                                <th width="6%">失败/存在</th>
                                <th width="12%">入库来源</th>
                                <th width="10%">IP</th>
                                <th width="12%">时间</th>
                                <th width="14%">操作</th>
                            </tr>
                        </thead>
                        <tbody id="list-content"></tbody>
                    </table>
                    <div id="AjaxPage" style="text-align:right;"></div>
                    <div style="text-align:right;">共<span id="total-count">0</span>条数据，<span id="allpage"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="list-template" type="text/html">
{{# for(var i=0;i<d.length;i++){ }}
<tr class="long-td">
    <td>{{d[i].id}}</td>
    <td style="text-align:left;">{{d[i].mname}}</td>
    <td>{{d[i].goodid}}</td>
    <td style="text-align:left;word-break:break-all;">{{d[i].addbiaoshi}}</td>
    <td>{{d[i].addnum}}</td>
    <td><span class="text-success">{{d[i].successnum}}</span></td>
    <td>{{d[i].failnum}} / {{d[i].existnum}}</td>
    <td>{{d[i].addqudao_label || d[i].addqudao || '—'}}</td>
    <td><span class="text-danger">{{d[i].userip || '—'}}</span></td>
    <td>{{d[i].create_time_fmt}}</td>
    <td>
        <a href="{:url('Kami/index')}?id={{d[i].goodid}}&addid={{d[i].id}}" class="btn btn-info btn-outline btn-xs">
            <i class="fa fa-list"></i> 查看卡密
        </a>
        <a href="javascript:;" onclick="del_by_addid({{d[i].id}})" class="btn btn-danger btn-outline btn-xs">
            <i class="fa fa-trash-o"></i> 删未用
        </a>
    </td>
</tr>
{{# } }}
</script>

<div class="spiner-example">
    <div class="sk-spinner sk-spinner-three-bounce">
        <div class="sk-bounce1"></div>
        <div class="sk-bounce2"></div>
        <div class="sk-bounce3"></div>
    </div>
</div>

{include file="public/footer" /}
<script type="text/javascript">
Ajaxpage();
function Ajaxpage(curr){
    var key = $('#key').val();
    var userip = $('#userip').val();
    var addqudao = $('#addqudao').val();
    var goodid = $('#goodid').val();
    $.getJSON('{:url("Kami/addlog")}', {
        page: curr || 1,
        key: key,
        userip: userip,
        addqudao: addqudao,
        goodid: goodid
    }, function(res){
        $(".spiner-example").css('display','none');
        var data = (res && res.list) ? res.list : (res || []);
        var allpage = (res && res.allpage) ? res.allpage : 1;
        var count = (res && typeof res.count !== 'undefined') ? res.count : data.length;
        $('#total-count').text(count);
        if(!data || data.length===0){
            $("#list-content").html('<td colspan="11" style="padding:10px;font-size:16px;text-align:center">暂无入库日志</td>');
            $('#allpage').html('第0页，共0页');
        }else{
            var tpl = document.getElementById('list-template').innerHTML;
            laytpl(tpl).render(data, function(html){
                document.getElementById('list-content').innerHTML = html;
            });
            laypage({
                cont: $('#AjaxPage'),
                pages: allpage,
                skip: true,
                skin: '#1AB5B7',
                curr: curr || 1,
                groups: 3,
                jump: function(obj, first){
                    if(!first){
                        Ajaxpage(obj.curr);
                    }
                    $('#allpage').html('第'+ obj.curr +'页，共'+ obj.pages +'页');
                }
            });
        }
    });
}
function del_by_addid(addid){
    layer.confirm('确认删除该批次【未使用】卡密？已售卡密将保留。', {icon: 3, title:'提示'}, function(index){
        $.getJSON('{:url("Kami/del_by_addid")}', {addid: addid}, function(res){
            if(res.code == 1){
                layer.msg(res.msg, {icon:1, time:2000, shade:0.1});
                Ajaxpage();
            }else{
                layer.msg(res.msg || '操作失败', {icon:2, time:2000, shade:0.1});
            }
        });
        layer.close(index);
    });
}
</script>
</body>
</html>
