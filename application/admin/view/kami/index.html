<script type="text/javascript">

    
  
    Ajaxpage();
    function Ajaxpage(curr){
        var key=$('#key').val();
        var mpid=$('#mpid').val();
        var addid=$('#addid').val() || 0;
        var misuse=$('#misuse').val();
        var syddhao=$('#syddhao').val();
        var starttime=$('#starttime').val();
        var endtime=$('#endtime').val();
        $.getJSON('{:url("Kami/index")}?id={$goodsid}', {
            page: curr || 1,
            key: key,
            mpid: mpid,
            addid: addid,
            misuse: misuse,
            syddhao: syddhao,
            starttime: starttime,
            endtime: endtime
        }, function(data){
            $(".spiner-example").css('display','none'); //数据加载完关闭动画 
            if(data==''){
                $("#list-content").html('<td colspan="20" style="padding-top:10px;padding-bottom:10px;font-size:16px;text-align:center">暂无数据</td>');
            }else{
                var tpl = document.getElementById('list-template').innerHTML;
                laytpl(tpl).render(data, function(html){
                    document.getElementById('list-content').innerHTML = html;
                });
                laypage({
                    cont: $('#AjaxPage'),//容器。值支持id名、原生dom对象，jquery对象,
                    pages:'{$allpage}',//总页数
                    skip: true,//是否开启跳页
                    
                    skin: '#1AB5B7',//分页组件颜色
                    curr: curr || 1,
                    groups: 3,//连续显示分页数
                    jump: function(obj, first){
                        if(!first){
                            Ajaxpage(obj.curr)
                        }
                        $('#allpage').html('第'+ obj.curr +'页，共'+ obj.pages +'页');
                    }
                });
            }
        });
    }

function removeHTMLTag(str) {
            str = str.replace(/<(style|script|iframe)[^>]*?>[\s\S]+?<\/\1\s*>/gi,'').replace(/<[^>]+?>/g,'').replace(/\s+/g,' ').replace(/ /g,' ').replace(/>/g,' '); //去除HTML tag
            str = str.replace(/[ | ]*\n/g,'\n'); //去除行尾空白
            //str = str.replace(/\n[\s| | ]*\r/g,'\n'); //去除多余空行
            str=str.replace(/&nbsp;/ig,'');//去掉&nbsp;
            //str=str.replace(/\s/g,''); //将空格去掉
            return str;
}
function htmlspecialchars(str) {        
              var s = "";  
              if (str.length == 0) return "";  
              for   (var i=0; i<str.length; i++)  
              {  
                  switch (str.substr(i,1))  
                  {  
                      case "<": s += "&lt;"; break;  
                      case ">": s += "&gt;"; break;  
                      case "&": s += "&amp;"; break;  
                      case " ":  
                          if(str.substr(i + 1, 1) == " "){  
                              s += " &nbsp;";  
                              i++;  
                          } else s += " ";  
                          break;  
                      case "\"": s += "&quot;"; break;  
                      case "\n": s += "<br>"; break;  
                      default: s += str.substr(i,1); break;  
                  }  
              }  
              return s;  
          }
  function htmlspecialchars_decode(str){           
              str = str.replace(/&amp;/g, '&'); 
              str = str.replace(/&lt;/g, '<');
              str = str.replace(/&gt;/g, '>');
              str = str.replace(/&quot;/g, "''");  
              str = str.replace(/&#039;/g, "'");  
              return str;  
    }
function checkAll() {  
        var all=document.getElementById('all');//获取到点击全选的那个复选框的id  
        var one=document.getElementsByName('checkname[]');//获取到复选框的名称  
        if(all.checked==true){
            for(var i=0;i<one.length;i++){  
                one[i].checked=true;
                
            }  
  
        }else{  
            for(var j=0;j<one.length;j++){  
                one[j].checked=false;  
            }  
        }  
}

function export_kami(){
	layer.open({
          type: 0, 
          anim: 3,
          content: ' <div class="row" >'
                    +'<div class="col-sm-10">'
                    +'<div class="input-group" style="margin-bottom:10px;">'
                    +'<span class="input-group-addon">导出数量   :</span>'
                    +'<input type="text" id="buynum" class="form-control" name="buynum" value="">'
                    +'</div>'
                    +'<div class="input-group">'
                    +'<span class="input-group-addon">超级密码   :</span>'
                    +'<input type="password" id="superpwd" class="form-control" name="superpwd" value="" autocomplete="off">'
                    +'</div>'
                    +'</div>'
                      +'</div>',
                title: ['导出卡密', 'font-size:18px;'],
                btn: ['确定', '取消']
                ,btnAlign: 'c'
                ,yes: function(index, layero){
                 var buynum=$("#buynum").val();
                 var superpwd=$("#superpwd").val();
                 if(!buynum || parseInt(buynum,10)<1){
                 	layer.msg('请填写导出数量');
                 	return false;
                 }
                 if(!superpwd){
                 	layer.msg('请输入超级密码');
                 	return false;
                 }
                 var form=$('<form method="post" action="{:url(\'export_kami\')}" style="display:none;"></form>');
                 form.append($('<input type="hidden" name="__token__">').val($('meta[name="csrf-token"]').attr('content') || '{$csrf_token|default=""}'));
                 form.append($('<input type="hidden" name="mflid">').val('{$goodsid}'));
                 form.append($('<input type="hidden" name="buynum">').val(buynum));
                 form.append($('<input type="hidden" name="superpwd">').val(superpwd));
                 $('body').append(form);
                 form.submit();
                 layer.close(index);
                },
                btn2: function(index, layero){
                  layer.closeAll();
                }
        });	
}

function toDecimal(x){
  		var f = parseFloat(x);
		if(isNaN(f)) {
			return false;
		}
		var f;
		if(getFloor(x)<2){
			f = Math.round(x * 100) / 100;
		}else if(getFloor(x)>2){
			f = Math.round(x * 10000) / 10000;
		}	
		var s = f.toString();
		var rs = s.indexOf('.');
		if(rs < 0) {
			rs = s.length;
			s += '.';
		}
		while(s.length <= rs + 2) {
			s += '0';
		}
		return s;
  	}
  	
	function getFloor(x){
		var y = String(x).indexOf('.') + 1;
		var count = String(x).length - y;
		if(y <= 0) {
			count=0;
		}
		return count;										
	}    
</script>
