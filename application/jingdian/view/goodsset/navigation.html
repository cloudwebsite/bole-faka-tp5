	<script>

	
	var laytpl;
	var laypage;
	var layer;
	var form;
	layui.use(['laytpl','laypage','layer','form'], function(){
	  laytpl = layui.laytpl;
	  laypage = layui.laypage;
	  layer = layui.layer;
	  form = layui.form;
	  
	  form.on('submit(formyijianAdd)', function(data){
		   	console.log(data.elem) //被执行事件的元素DOM对象，一般为button对象
			console.log(data.form) //被执行提交的form对象，一般在存在form标签时才会返回
			console.log(data.field) //当前容器的全部表单字段，名值对形式：{name: value}
			var indexload = layer.load(0, {shade: [0.4,'#0f0e0e']});
			$.getJSON('{:url("jingdian/Navigation/add_navigation")}',data.field, function(data){
	            $(".spiner-example").css('display','none'); //数据加载完关闭动画 
	           	layer.close(indexload);
	           	if(data.code==1){
	           		layer.alert(data.msg, {
					  icon: 6,
					  skin: 'layer-ext-moon',
					  yes: function(index, layero){
					    layer.close(index);
					    location.reload()
					  }
					});
	           	}else{
	           		layer.alert(data.msg, {
					  icon: 5,
					  skin: 'layer-ext-moon',
					  yes: function(index, layero){
					  	layer.close(index);
					    location.reload()
					  }
					});
	           	}
	        });
			return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
		});
		Ajaxpage();
	}); 	
	
	
    function Ajaxpage(curr){
        
        var key=$('#key').val();
        $.getJSON('{:url("Navigation/usnavigation")}', {page: curr || 1,key:key}, function(data){
            $(".spiner-example").css('display','none'); //数据加载完关闭动画 
            if(data==''){
                $("#list-content").html('<td colspan="20" style="padding-top:10px;padding-bottom:10px;font-size:16px;text-align:center">暂无数据</td>');
            }else{
                var tpl = document.getElementById('list-template').innerHTML;
                laytpl(tpl).render(data, function(html){
                    document.getElementById('list-content').innerHTML = html;
                });
                laypage.render({
				    elem: 'AjaxPage'
				    ,count: {$count}
				    ,curr: curr || 1
				    ,layout: ['count', 'prev', 'page', 'next', 'refresh', 'skip']
				    ,jump: function(obj, first){
				    	if(!first){
				    		$(".spiner-example").show(); //数据加载完关闭动画 
				    		document.getElementById('list-content').innerHTML='';
                            Ajaxpage(obj.curr)
                        }
				      console.log(obj)
				    }
				  });
                
            }
        });
    }
    
    function editNavigation(id){
    	location.href = '{:url("Navigation/edit_navigation")}'+'?id='+id;
    	
    }
    function yijianAdd(){   	
    	layer.open({
		  type: 1,
		  title:'添加导航',
		  area: '390px',
		  content: $('#yijianAdd')
		});
    }
    function DelNavigation(id){
    	//询问框
		layer.confirm('是否删除此导航？', {
		  btn: ['确定','取消'] //按钮
		}, function(){
		  var indexload = layer.load(0, {shade: [0.4,'#0f0e0e']});
		  $.getJSON('{:url("Navigation/del_navigation")}'+"?id="+id,{}, function(data){
		  		layer.close(indexload);
	           	if(data.code==1){
	           		layer.alert(data.msg, {
					  icon: 6,
					  skin: 'layer-ext-moon',
					  yes: function(index, layero){
					  	layer.close(index);
					    location.reload()
					  }
					});
	           	}else{
	           		layer.alert(data.msg, {
					  icon: 5,
					  skin: 'layer-ext-moon',
					  yes: function(index, layero){
					  	layer.close(index);
					    location.reload()
					  }
					});
	           	}
		  	
		  });
		  
		});
    }
    
    function removeHTMLTag(str) {
	            str = str.replace(/<(style|script|iframe)[^>]*?>[\s\S]+?<\/\1\s*>/gi,'').replace(/<[^>]+?>/g,'').replace(/\s+/g,' ').replace(/ /g,' ').replace(/>/g,' '); //去除HTML tag
	            str = str.replace(/[ | ]*\n/g,'\n'); //去除行尾空白
	            //str = str.replace(/\n[\s| | ]*\r/g,'\n'); //去除多余空行
	            str=str.replace(/&nbsp;/ig,'');//去掉&nbsp;
	            //str=str.replace(/\s/g,''); //将空格去掉
	            return str;
	}
    function htmlspecialchars(str) {        
              var s = "";  
              if (str.length == 0) return "";  
              for   (var i=0; i<str.length; i++)  
              {  
                  switch (str.substr(i,1))  
                  {  
                      case "<": s += "&lt;"; break;  
                      case ">": s += "&gt;"; break;  
                      case "&": s += "&amp;"; break;  
                      case " ":  
                          if(str.substr(i + 1, 1) == " "){  
                              s += " &nbsp;";  
                              i++;  
                          } else s += " ";  
                          break;  
                      case "\"": s += "&quot;"; break;  
                      case "\n": s += "<br>"; break;  
                      default: s += str.substr(i,1); break;  
                  }  
              }  
              return s;  
          }
  	function htmlspecialchars_decode(str){           
              str = str.replace(/&amp;/g, '&'); 
              str = str.replace(/&lt;/g, '<');
              str = str.replace(/&gt;/g, '>');
              str = str.replace(/&quot;/g, "''");  
              str = str.replace(/&#039;/g, "'");  
              return str;  
    }
  	function toDecimal(x){
  		var f = parseFloat(x);
		if(isNaN(f)) {
			return false;
		}
		var f;
		if(getFloor(x)<2){
			f = Math.round(x * 100) / 100;
		}else if(getFloor(x)>2){
			f = Math.round(x * 10000) / 10000;
		}	
		var s = f.toString();
		var rs = s.indexOf('.');
		if(rs < 0) {
			rs = s.length;
			s += '.';
		}
		while(s.length <= rs + 2) {
			s += '0';
		}
		return s;
  	}
  	
	function getFloor(x){
		var y = String(x).indexOf('.') + 1;
		var count = String(x).length - y;
		if(y <= 0) {
			count=0;
		}
		return count;										
	}
	</script>
